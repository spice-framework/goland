name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: goland-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out exact compatibility inputs
        shell: pwsh
        run: |
          $settings = ConvertFrom-StringData (Get-Content compatibility.properties -Raw)
          $repositories = @(
            @("spice", "https://github.com/spice-framework/spice.git", $settings.spiceCommit),
            @("toolchain", "https://github.com/spice-framework/toolchain.git", $settings.toolchainCommit),
            @("petclinic", "https://github.com/spice-framework/petclinic.git", $settings.petclinicCommit)
          )
          foreach ($repository in $repositories) {
            $path = Join-Path "dependencies" $repository[0]
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            git -C $path init --quiet
            git -C $path remote add origin $repository[1]
            git -C $path fetch --quiet --depth=1 origin $repository[2]
            git -C $path checkout --quiet --detach FETCH_HEAD
            if ((git -C $path rev-parse HEAD) -ne $repository[2]) {
              throw "compatibility checkout for $($repository[0]) is not exact"
            }
          }
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify packaged plugin on Linux
        if: runner.os == 'Linux'
        env:
          SPICE_CORE_ROOT: ${{ github.workspace }}/dependencies/spice
          SPICE_TOOLCHAIN_ROOT: ${{ github.workspace }}/dependencies/toolchain
          SPICE_PETCLINIC_ROOT: ${{ github.workspace }}/dependencies/petclinic
        run: >-
          xvfb-run -a ./gradlew --no-daemon --no-parallel --console=plain
          verifyRepository
      - name: Verify packaged plugin on macOS
        if: runner.os == 'macOS'
        env:
          SPICE_CORE_ROOT: ${{ github.workspace }}/dependencies/spice
          SPICE_TOOLCHAIN_ROOT: ${{ github.workspace }}/dependencies/toolchain
          SPICE_PETCLINIC_ROOT: ${{ github.workspace }}/dependencies/petclinic
        run: >-
          ./gradlew --no-daemon --no-parallel --console=plain
          verifyRepository
      - name: Verify packaged plugin on Windows
        if: runner.os == 'Windows'
        env:
          SPICE_CORE_ROOT: ${{ github.workspace }}/dependencies/spice
          SPICE_TOOLCHAIN_ROOT: ${{ github.workspace }}/dependencies/toolchain
          SPICE_PETCLINIC_ROOT: ${{ github.workspace }}/dependencies/petclinic
        run: >-
          .\gradlew.bat --no-daemon --no-parallel --console=plain
          verifyRepository
      - name: Preserve packaged plugin
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spice-goland-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  installed-ui:
    name: Installed UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out exact compatibility inputs
        shell: pwsh
        run: |
          $settings = ConvertFrom-StringData (Get-Content compatibility.properties -Raw)
          $repositories = @(
            @("spice", "https://github.com/spice-framework/spice.git", $settings.spiceCommit),
            @("toolchain", "https://github.com/spice-framework/toolchain.git", $settings.toolchainCommit),
            @("petclinic", "https://github.com/spice-framework/petclinic.git", $settings.petclinicCommit)
          )
          foreach ($repository in $repositories) {
            $path = Join-Path "dependencies" $repository[0]
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            git -C $path init --quiet
            git -C $path remote add origin $repository[1]
            git -C $path fetch --quiet --depth=1 origin $repository[2]
            git -C $path checkout --quiet --detach FETCH_HEAD
          }
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Exercise installed GoLand on Linux
        if: runner.os == 'Linux'
        env:
          SPICE_CORE_ROOT: ${{ github.workspace }}/dependencies/spice
          SPICE_TOOLCHAIN_ROOT: ${{ github.workspace }}/dependencies/toolchain
          SPICE_PETCLINIC_ROOT: ${{ github.workspace }}/dependencies/petclinic
        run: >-
          xvfb-run -a ./gradlew --no-daemon --no-parallel --console=plain
          verifyInstalledIde
      - name: Exercise installed GoLand on Windows
        if: runner.os == 'Windows'
        env:
          SPICE_CORE_ROOT: ${{ github.workspace }}/dependencies/spice
          SPICE_TOOLCHAIN_ROOT: ${{ github.workspace }}/dependencies/toolchain
          SPICE_PETCLINIC_ROOT: ${{ github.workspace }}/dependencies/petclinic
        run: >-
          .\gradlew.bat --no-daemon --no-parallel --console=plain
          verifyInstalledIde
      - name: Preserve installed-IDE evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-ui-${{ matrix.os }}
          path: |
            build/reports/visual/**
            build/reports/tests/integrationTest/**
            build/test-results/integrationTest/**
          if-no-files-found: warn
