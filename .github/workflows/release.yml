name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

concurrency:
  group: goland-production-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"
  JAVA_VERSION: "25"
  TRUSTED_RELEASE_KEY: security/release/ed25519-public.pem

jobs:
  validate-source:
    name: Validate source and build unsigned package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      epoch: ${{ steps.metadata.outputs.epoch }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the complete tagged repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable tag and declared plugin version
        id: metadata
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$REF_NAME" = "v$(sed -n 's/^pluginVersion=//p' compatibility.properties)"
          test -f "$TRUSTED_RELEASE_KEY"
          commit="$(git rev-parse --verify "refs/tags/$REF_NAME^{commit}")"
          test "$commit" = "$(git rev-parse --verify 'HEAD^{commit}')"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          test -z "$(git status --porcelain --untracked-files=normal)"
          {
            printf 'commit=%s\n' "$commit"
            printf 'epoch=%s\n' "$(git show -s --format=%ct "$commit")"
            printf 'version=%s\n' "$REF_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Check out exact compatibility inputs
        shell: pwsh
        run: |
          $settings = ConvertFrom-StringData (Get-Content compatibility.properties -Raw)
          $repositories = @(
            @("spice", "https://github.com/spice-framework/spice.git", $settings.spiceCommit),
            @("toolchain", "https://github.com/spice-framework/toolchain.git", $settings.toolchainCommit),
            @("petclinic", "https://github.com/spice-framework/petclinic.git", $settings.petclinicCommit)
          )
          foreach ($repository in $repositories) {
            $path = Join-Path "dependencies" $repository[0]
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            git -C $path init --quiet
            git -C $path remote add origin $repository[1]
            git -C $path fetch --quiet --depth=1 origin $repository[2]
            git -C $path checkout --quiet --detach FETCH_HEAD
            if ((git -C $path rev-parse HEAD) -ne $repository[2]) {
              throw "compatibility checkout for $($repository[0]) is not exact"
            }
          }
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Verify exact source and packaged plugin
        env:
          SPICE_CORE_ROOT: ${{ github.workspace }}/dependencies/spice
          SPICE_TOOLCHAIN_ROOT: ${{ github.workspace }}/dependencies/toolchain
          SPICE_PETCLINIC_ROOT: ${{ github.workspace }}/dependencies/petclinic
        run: >-
          xvfb-run -a ./gradlew --no-daemon --no-parallel --console=plain
          verifyRepository
      - name: Render deterministic unsigned release
        shell: bash
        env:
          COMMIT: ${{ steps.metadata.outputs.commit }}
          EPOCH: ${{ steps.metadata.outputs.epoch }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          input="build/distributions/spice-goland-${VERSION#v}.zip"
          test -f "$input"
          go -C release-tools run ./cmd/editor-release package \
            -root .. -input "../$input" -output ../dist-unsigned \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
      - name: Prove release preparation preserved source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.commit }}
          path: dist-unsigned/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  independent-rebuild:
    name: Independently rebuild on Windows
    needs: validate-source
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build and package without signing material
        shell: pwsh
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat --no-daemon --no-parallel --console=plain clean buildPlugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C release-tools run ./cmd/editor-release package `
            -root .. -input "../build/distributions/spice-goland-$($env:VERSION.Substring(1)).zip" `
            -output ../dist-rebuilt -version $env:VERSION -commit $env:COMMIT -epoch $env:EPOCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: dist-rebuilt/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compare-unsigned:
    name: Compare unsigned Linux and Windows packages
    needs: [validate-source, independent-rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download primary unsigned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/unsigned
      - name: Download independent rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuilt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/rebuilt
      - name: Require exact unsigned reproducibility before signing
        shell: bash
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          names=(
            checksums.txt
            "spice-goland_${VERSION#v}.zip"
            "spice-goland_${VERSION#v}_sbom.spdx.json"
            "spice-goland_${VERSION#v}_provenance.intoto.jsonl"
          )
          test "$(find artifacts/unsigned -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find artifacts/rebuilt -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          : > reproducibility.txt
          for name in "${names[@]}"; do
            cmp --silent "artifacts/unsigned/$name" "artifacts/rebuilt/$name"
            printf '%s\n' "$name" >> reproducibility.txt
          done
      - name: Retain reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: reproducibility.txt
          if-no-files-found: error
          retention-days: 90

  sign:
    name: Sign authenticated checksums
    needs: [validate-source, compare-unsigned]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-signing
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Download unsigned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/unsigned
      - name: Sign with protected Ed25519 key
        shell: bash
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          SPICE_EDITOR_RELEASE_SIGNING_KEY: ${{ secrets.SPICE_EDITOR_RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$SPICE_EDITOR_RELEASE_SIGNING_KEY"
          go -C release-tools run ./cmd/editor-release sign \
            -root .. -input ../artifacts/unsigned -output ../artifacts/signed \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
      - name: Upload signed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/signed/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-artifacts:
    name: Independently verify signature and reproducibility
    needs: [validate-source, compare-unsigned, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Download signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/signed
      - name: Verify public trust after reproducibility gate
        shell: bash
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          go -C release-tools run ./cmd/editor-release verify \
            -root .. -input ../artifacts/signed \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH" | tee verification.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: verification.txt
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Reverify and publish under protected approval
    needs: [validate-source, sign, verify-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-publish
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-source.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Download verified signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/signed
      - name: Reverify, publish, download, and reverify exact assets
        shell: bash
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          go -C release-tools run ./cmd/editor-release verify \
            -root .. -input ../artifacts/signed \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
          test "$(find artifacts/signed -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq .sha)" = "$COMMIT"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag --target "$COMMIT" --title "Spice GoLand Plugin $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber artifacts/signed/*
          mkdir artifacts/downloaded
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir artifacts/downloaded
          test "$(find artifacts/downloaded -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          for file in artifacts/signed/*; do cmp --silent "$file" "artifacts/downloaded/$(basename "$file")"; done
          go -C release-tools run ./cmd/editor-release verify \
            -root .. -input ../artifacts/downloaded \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
